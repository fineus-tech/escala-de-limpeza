<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escala de Limpeza</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #222;
      overflow-x: hidden;
    }

    /* Fundo animado */
    .animated-background {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(59,130,246,.28), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(16,185,129,.22), transparent 30%),
        linear-gradient(135deg, #0f172a, #172554 45%, #064e3b);
    }

    .animated-background::before,
    .animated-background::after {
      content: "";
      position: absolute;
      width: 45vw;
      height: 45vw;
      min-width: 280px;
      min-height: 280px;
      border-radius: 50%;
      filter: blur(35px);
      opacity: .35;
      animation: floatBlob 14s ease-in-out infinite alternate;
    }

    .animated-background::before {
      left: -12vw;
      top: -10vw;
      background: rgba(96,165,250,.55);
    }

    .animated-background::after {
      right: -12vw;
      bottom: -10vw;
      background: rgba(52,211,153,.45);
      animation-delay: -7s;
    }

    .particles {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.22) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1.5px);
      background-size: 42px 42px, 73px 73px;
      background-position: 0 0, 18px 25px;
      animation: drift 22s linear infinite;
      opacity: .35;
    }

    @keyframes drift {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(42px,73px,0); }
    }

    @keyframes floatBlob {
      from { transform: translate3d(-10px,-8px,0) scale(1); }
      to { transform: translate3d(28px,22px,0) scale(1.12); }
    }

    header {
      background: rgba(15,23,42,.86);
      backdrop-filter: blur(10px);
      color: white;
      text-align: center;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.18);
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: rgba(255,255,255,.96);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.55);
    }

    .config-toggle {
      width: auto;
      display: block;
      margin: 0 auto 15px;
      padding: 11px 16px;
      font-size: 14px;
      background: rgba(15,23,42,.92);
    }

    .config-toggle:hover {
      background: rgba(30,41,59,.98);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2,6,23,.68);
      backdrop-filter: blur(5px);
    }

    .modal.aberto {
      display: flex;
    }

    .modal-conteudo {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .modal-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .fechar-modal {
      width: 42px;
      height: 42px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      font-size: 22px;
      background: #e5e7eb;
      color: #111827;
    }

    .fechar-modal:hover {
      background: #d1d5db;
    }

    .login-overlay {
      position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(2,6,23,.82); backdrop-filter: blur(8px);
    }
    .login-box { width: min(420px,100%); background: white; border-radius: 18px; padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .login-box h2 { margin-top: 0; text-align: center; }
    .login-box input { width:100%; padding:13px; margin-top:8px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
    .login-box label { display:block; margin-top:14px; font-weight:bold; }
    .login-erro { color:#c62828; text-align:center; margin-top:12px; min-height:20px; }
    .usuario-logado { font-size:13px; margin-top:8px; opacity:.9; }
    .sair { width:auto; padding:8px 14px; margin-top:10px; font-size:13px; background:#475569; }

    @media (prefers-reduced-motion: reduce) {
      .animated-background::before,
      .animated-background::after,
      .particles {
        animation: none;
      }
    }

    .data {
      text-align: center;
      font-size: 18px;
      color: #555;
    }

    .responsavel {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
    }

    .tarefas {
      margin-top: 20px;
    }

    .tarefa {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .feito {
      text-align: center;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 15px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
    }

    .proxima {
      text-align: center;
      font-size: 18px;
    }

    .historico-item {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .historico-item:last-child {
      border-bottom: none;
    }

    .status-feito {
      color: #2e7d32;
      font-weight: bold;
    }

    .status-pendente {
      color: #c62828;
      font-weight: bold;
    }

    .carregando {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>Entrar na escala</h2>
    <p style="text-align:center;color:#666;">Use seu e-mail e senha.</p>
    <label for="loginEmail">E-mail</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="seu@email.com">
    <label for="loginSenha">Senha</label>
    <input id="loginSenha" type="password" autocomplete="current-password" placeholder="Sua senha">
    <button id="botaoLogin">ENTRAR</button>
    <div id="loginErro" class="login-erro"></div>
  </div>
</div>

<div class="animated-background" aria-hidden="true">
  <div class="particles"></div>
</div>

<header>
  <h1>ESCALA DE LIMPEZA</h1>
  <div id="usuarioLogado" class="usuario-logado"></div>
  <button id="botaoSair" class="sair" style="display:none;">SAIR</button>
</header>

<div class="container">

  <div id="carregando" class="card carregando">
    Carregando escala...
  </div>

  <div id="conteudo" style="display:none;">

    <div class="card">

      <div class="data" id="dataAtual"></div>

      <div class="responsavel" id="responsavel"></div>

      <div class="tarefas">

        <div class="tarefa">
          🧹 Limpar toda a casa
        </div>

        <div class="tarefa">
          🚿 Lavar o banheiro
        </div>

      </div>

      <div id="status"></div>

      <button id="botaoFeito">
        MARCAR COMO FEITO
      </button>

    </div>


    <div class="card">
      <h2>⚙️ Configurações da escala</h2>

      <p style="color:#666;">
        Altere os moradores, a data inicial e o intervalo entre as limpezas.
      </p>

      <label><strong>Moradores (um por linha)</strong></label>
      <textarea id="nomesConfiguracao"
        style="width:100%;min-height:120px;margin-top:8px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
        placeholder="Henrique&#10;Eduardo&#10;Moisés&#10;Edvan"></textarea>

      <label style="display:block;margin-top:15px;">
        <strong>Data da primeira limpeza</strong>
      </label>
      <input id="dataInicioConfiguracao" type="date"
        style="width:100%;margin-top:8px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;">

      <label style="display:block;margin-top:15px;">
        <strong>Intervalo entre limpezas (dias)</strong>
      </label>
      <input id="intervaloConfiguracao" type="number" min="1" max="365"
        style="width:100%;margin-top:8px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;">

      <label style="display:block;margin-top:15px;">
        <strong>Quem começa a sequência?</strong>
      </label>
      <select id="primeiroMoradorConfiguracao"
        style="width:100%;margin-top:8px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;">
      </select>

      <button id="botaoSalvarConfiguracao">
        SALVAR CONFIGURAÇÃO
      </button>

      <div id="mensagemConfiguracao" style="text-align:center;margin-top:10px;"></div>
    </div>


    <div class="card">

      <h2>Próxima limpeza</h2>

      <div class="proxima" id="proximaLimpeza"></div>

    </div>


    <div class="card">

      <h2>Histórico</h2>

      <div id="historico">
        Carregando histórico...
      </div>

    </div>

  </div>

</div>


<script type="module">

  // ================================
  // FIREBASE
  // ================================

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    onSnapshot,
    getDocs,
    getDoc
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  // ================================
  // CONFIGURAÇÃO DO FIREBASE
  // ================================

  const firebaseConfig = {

    apiKey: "AIzaSyBuUpOByfmMt4fpTeGrV3szZjBEpW22Vvk",

    authDomain:
      "escala-de-limpeza-2db5d.firebaseapp.com",

    projectId:
      "escala-de-limpeza-2db5d",

    storageBucket:
      "escala-de-limpeza-2db5d.firebasestorage.app",

    messagingSenderId:
      "929352610860",

    appId:
      "1:929352610860:web:421eedb2980e8874814d89",

    measurementId:
      "G-HLF3DB675W"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);
  const auth = getAuth(app);


  // ================================
  // MORADORES
  // ================================

  // ================================
  // CONFIGURAÇÃO DA ESCALA
  // ================================

  // Estes valores são os padrões iniciais.
  // As configurações alteradas pelo administrador são salvas no Firebase.
  let moradores = [
    "Henrique",
    "Eduardo",
    "Moisés",
    "Edvan"
  ];

  // 13/09/2026 = Henrique
  let dataInicio = new Date(2026, 8, 13);

  // Intervalo entre uma limpeza e a próxima.
  let intervaloDias = 2;

  // Índice de quem começa a sequência.
  let indiceInicial = 0;


  // ================================
  // FUNÇÕES DE DATA
  // ================================

  function formatarData(data) {

    const dia = String(data.getDate()).padStart(2, "0");

    const mes = String(data.getMonth() + 1).padStart(2, "0");

    const ano = data.getFullYear();

    return `${dia}/${mes}/${ano}`;
  }


  function formatarDataBanco(data) {

    const dia = String(data.getDate()).padStart(2, "0");

    const mes = String(data.getMonth() + 1).padStart(2, "0");

    const ano = data.getFullYear();

    return `${ano}-${mes}-${dia}`;
  }


  function calcularResponsavel(data) {

    const diferenca =
      Math.floor(
        (data - dataInicio) /
        (1000 * 60 * 60 * 24)
      );

    if (diferenca < 0 || moradores.length === 0) {
      return moradores[indiceInicial] || "";
    }

    const quantidadeLimpezas =
      Math.floor(diferenca / intervaloDias);

    const indice =
      (indiceInicial + quantidadeLimpezas) % moradores.length;

    return moradores[indice];
  }


  // ================================
  // DATA DE HOJE
  // ================================

  function obterDataHoje() {

    const agora = new Date();

    agora.setHours(0, 0, 0, 0);

    return agora;
  }


  // ================================
  // DOCUMENTO DO DIA
  // ================================

  function idDaLimpeza(data) {

    return formatarDataBanco(data);
  }


  // ================================
  // GARANTIR QUE A LIMPEZA EXISTE
  // ================================

  async function criarLimpezaSeNecessario(data) {
    const responsavel = calcularResponsavel(data);
    const id = idDaLimpeza(data);
    const referencia = doc(db, "limpezas", id);

    // Só cria o documento se ele ainda não existir.
    // Assim uma limpeza já concluída nunca volta para "pendente"
    // apenas porque alguém abriu o aplicativo novamente.
    const existente = await getDoc(referencia);

    if (!existente.exists()) {
      await setDoc(referencia, {
        data: formatarData(data),
        responsavel: responsavel,
        concluido: false
      });
    }
  }


  // ================================
  // CONFIGURAÇÕES DA ESCALA
  // ================================

  async function carregarConfiguracao() {
    const referencia = doc(db, "configuracao", "escala");

    try {
      const consulta = await getDocs(collection(db, "configuracao"));
      let configuracaoEncontrada = null;

      consulta.forEach((documento) => {
        if (documento.id === "escala") {
          configuracaoEncontrada = documento.data();
        }
      });

      if (configuracaoEncontrada) {
        if (Array.isArray(configuracaoEncontrada.moradores) &&
            configuracaoEncontrada.moradores.length > 0) {
          moradores = configuracaoEncontrada.moradores;
        }

        if (configuracaoEncontrada.dataInicio) {
          const partes = configuracaoEncontrada.dataInicio.split("-");
          if (partes.length === 3) {
            dataInicio = new Date(
              Number(partes[0]),
              Number(partes[1]) - 1,
              Number(partes[2])
            );
          }
        }

        if (Number(configuracaoEncontrada.intervaloDias) > 0) {
          intervaloDias = Number(configuracaoEncontrada.intervaloDias);
        }

        if (Number.isInteger(configuracaoEncontrada.indiceInicial)) {
          indiceInicial = configuracaoEncontrada.indiceInicial;
        }
      }

      preencherFormularioConfiguracao();
    } catch (erro) {
      console.error("Erro ao carregar configuração:", erro);
      preencherFormularioConfiguracao();
    }
  }


  function preencherFormularioConfiguracao() {
    const nomes = document.getElementById("nomesConfiguracao");
    const data = document.getElementById("dataInicioConfiguracao");
    const intervalo = document.getElementById("intervaloConfiguracao");
    const primeiro = document.getElementById("primeiroMoradorConfiguracao");

    if (!nomes) return;

    nomes.value = moradores.join("\n");

    data.value =
      formatarDataBanco(dataInicio);

    intervalo.value = intervaloDias;

    primeiro.innerHTML = "";

    moradores.forEach((morador, indice) => {
      const opcao = document.createElement("option");
      opcao.value = indice;
      opcao.textContent = morador;

      if (indice === indiceInicial) {
        opcao.selected = true;
      }

      primeiro.appendChild(opcao);
    });
  }


  async function salvarConfiguracao() {
    const nomesTexto =
      document.getElementById("nomesConfiguracao").value;

    const novaLista =
      nomesTexto
        .split("\n")
        .map((nome) => nome.trim())
        .filter((nome) => nome.length > 0);

    const novaData =
      document.getElementById("dataInicioConfiguracao").value;

    const novoIntervalo =
      Number(document.getElementById("intervaloConfiguracao").value);

    const novoIndice =
      Number(document.getElementById("primeiroMoradorConfiguracao").value);

    const mensagem =
      document.getElementById("mensagemConfiguracao");

    if (novaLista.length === 0) {
      mensagem.innerHTML =
        '<span class="status-pendente">Informe pelo menos um morador.</span>';
      return;
    }

    if (!novaData || novoIntervalo < 1) {
      mensagem.innerHTML =
        '<span class="status-pendente">Preencha a data e um intervalo válido.</span>';
      return;
    }

    moradores = novaLista;
    const partes = novaData.split("-");

    dataInicio = new Date(
      Number(partes[0]),
      Number(partes[1]) - 1,
      Number(partes[2])
    );

    intervaloDias = novoIntervalo;
    indiceInicial =
      Math.min(novoIndice, moradores.length - 1);

    try {
      await setDoc(
        doc(db, "configuracao", "escala"),
        {
          moradores: moradores,
          dataInicio: novaData,
          intervaloDias: intervaloDias,
          indiceInicial: indiceInicial
        },
        { merge: true }
      );

      // Cria/atualiza o registro de hoje com a nova regra.
      const hoje = obterDataHoje();

      await setDoc(
        doc(db, "limpezas", idDaLimpeza(hoje)),
        {
          data: formatarData(hoje),
          responsavel: calcularResponsavel(hoje)
        },
        { merge: true }
      );

      document.getElementById("responsavel").innerText =
        calcularResponsavel(hoje);

      mostrarProximaLimpeza();
      preencherFormularioConfiguracao();
      carregarHistorico();

      mensagem.innerHTML =
        '<span class="status-feito">Configuração salva com sucesso.</span>';

      setTimeout(() => {
        fecharConfiguracao();
      }, 700);

    } catch (erro) {
      console.error(erro);

      mensagem.innerHTML =
        '<span class="status-pendente">Não foi possível salvar a configuração.</span>';
    }
  }


  // ================================
  // MARCAR COMO FEITO
  // ================================

  async function marcarComoFeito() {

  const hoje = obterDataHoje();

  const id = idDaLimpeza(hoje);

  const referencia = doc(db, "limpezas", id);

  try {

    await setDoc(
      referencia,
      {
        data: formatarData(hoje),
        responsavel: calcularResponsavel(hoje),
        concluido: true
      },
      {
        merge: true
      }
    );

    alert("Limpeza marcada como concluída.");

    // Atualiza o histórico depois de salvar
    carregarHistorico();

  } catch (erro) {

    console.error(erro);

    alert(
      "Não foi possível marcar a limpeza como concluída."
    );
  }
}
  async function desmarcarComoFeito() {
    if (!confirm("Deseja realmente desfazer a conclusão desta limpeza?")) return;

    const hoje = obterDataHoje();
    try {
      await setDoc(
        doc(db, "limpezas", idDaLimpeza(hoje)),
        { concluido: false },
        { merge: true }
      );
      carregarHistorico();
    } catch (erro) {
      console.error(erro);
      alert("Não foi possível desfazer a conclusão.");
    }
  }


  // ================================
  // MOSTRAR STATUS
  // ================================

  function mostrarStatus(concluido) {

    const status =
      document.getElementById("status");

    const botao =
      document.getElementById("botaoFeito");


    if (concluido) {

      status.innerHTML =
        `<div class="feito">
          LIMPEZA CONCLUÍDA
        </div>`;

      botao.disabled = true;

      botao.innerText =
        "LIMPEZA JÁ FOI FEITA";

      if (!document.getElementById("botaoDesfazer")) {
        const desfazer = document.createElement("button");
        desfazer.id = "botaoDesfazer";
        desfazer.type = "button";
        desfazer.innerText = "DESFAZER CONCLUSÃO";
        desfazer.style.background = "#64748b";
        desfazer.addEventListener("click", desmarcarComoFeito);
        botao.parentNode.appendChild(desfazer);
      }

    } else {

      status.innerHTML = "";

      botao.disabled = false;

      botao.innerText =
        "MARCAR COMO FEITO";

      const desfazer = document.getElementById("botaoDesfazer");
      if (desfazer) desfazer.remove();
    }
  }


  // ================================
  // MOSTRAR PRÓXIMA LIMPEZA
  // ================================

  function mostrarProximaLimpeza() {

    const hoje =
      obterDataHoje();

    const proxima =
      new Date(hoje);

    proxima.setDate(
      proxima.getDate() + intervaloDias
    );


    const responsavel =
      calcularResponsavel(proxima);


    document.getElementById(
      "proximaLimpeza"
    ).innerHTML =

      `<strong>${formatarData(proxima)}</strong><br>
       Responsável: <strong>${responsavel}</strong>`;
  }


  // ================================
  // HISTÓRICO
  // ================================

  async function carregarHistorico() {

    const historico =
      document.getElementById("historico");


    try {

      const consulta =
        await getDocs(
          collection(db, "limpezas")
        );


      let registros = [];


      consulta.forEach((documento) => {

        registros.push(
          documento.data()
        );

      });


      registros.sort((a, b) => {

        const dataA =
          a.data.split("/").reverse().join("");

        const dataB =
          b.data.split("/").reverse().join("");

        return dataB.localeCompare(dataA);

      });


      if (registros.length === 0) {

        historico.innerHTML =
          "Nenhum registro encontrado.";

        return;
      }


      historico.innerHTML = "";


      registros.forEach((registro) => {

        const item =
          document.createElement("div");

        item.className =
          "historico-item";


        const status =
          registro.concluido
            ? `<span class="status-feito">FEITO</span>`
            : `<span class="status-pendente">PENDENTE</span>`;


        item.innerHTML =

          `<strong>${registro.data}</strong>
           — ${registro.responsavel}
           — ${status}`;


        historico.appendChild(item);

      });


    } catch (erro) {

      console.error(erro);

      historico.innerHTML =
        "Erro ao carregar histórico.";
    }
  }


  // ================================
  // INICIAR APLICATIVO
  // ================================

  async function iniciar() {

    await carregarConfiguracao();

    const hoje =
      obterDataHoje();


    // Cria o registro do dia,
    // caso ainda não exista.

    await criarLimpezaSeNecessario(
      hoje
    );


    // Mostra informações

    document.getElementById(
      "dataAtual"
    ).innerText =
      "Data: " + formatarData(hoje);


    document.getElementById(
      "responsavel"
    ).innerText =
      calcularResponsavel(hoje);


    mostrarProximaLimpeza();

    carregarHistorico();


    // ================================
    // OUVIR ALTERAÇÕES EM TEMPO REAL
    // ================================

    const referencia =
      doc(
        db,
        "limpezas",
        idDaLimpeza(hoje)
      );


    onSnapshot(
      referencia,
      (documento) => {

        if (documento.exists()) {

          const dados =
            documento.data();

          mostrarStatus(
            dados.concluido === true
          );

        }

      }
    );


    document.getElementById(
      "botaoFeito"
    ).addEventListener(
      "click",
      marcarComoFeito
    );

    document.getElementById(
      "botaoSalvarConfiguracao"
    ).addEventListener(
      "click",
      salvarConfiguracao
    );


    document.getElementById(
      "carregando"
    ).style.display =
      "none";


    document.getElementById(
      "conteudo"
    ).style.display =
      "block";
  }


  iniciar();

</script>
