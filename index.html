<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escala de Limpeza</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .data {
      text-align: center;
      font-size: 18px;
      color: #555;
    }

    .responsavel {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
    }

    .tarefas {
      margin-top: 20px;
    }

    .tarefa {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .feito {
      text-align: center;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 15px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
    }

    .proxima {
      text-align: center;
      font-size: 18px;
    }

    .historico-item {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .historico-item:last-child {
      border-bottom: none;
    }

    .status-feito {
      color: #2e7d32;
      font-weight: bold;
    }

    .status-pendente {
      color: #c62828;
      font-weight: bold;
    }

    .carregando {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ESCALA DE LIMPEZA</h1>
</header>

<div class="container">

  <div id="carregando" class="card carregando">
    Carregando escala...
  </div>

  <div id="conteudo" style="display:none;">

    <div class="card">

      <div class="data" id="dataAtual"></div>

      <div class="responsavel" id="responsavel"></div>

      <div class="tarefas">

        <div class="tarefa">
          🧹 Limpar toda a casa
        </div>

        <div class="tarefa">
          🚿 Lavar o banheiro
        </div>

      </div>

      <div id="status"></div>

      <button id="botaoFeito">
        MARCAR COMO FEITO
      </button>

    </div>


    <div class="card">

      <h2>Próxima limpeza</h2>

      <div class="proxima" id="proximaLimpeza"></div>

    </div>


    <div class="card">

      <h2>Histórico</h2>

      <div id="historico">
        Carregando histórico...
      </div>

    </div>

  </div>

</div>


<script type="module">

  // ================================
  // FIREBASE
  // ================================

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    onSnapshot,
    getDocs
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  // ================================
  // CONFIGURAÇÃO DO FIREBASE
  // ================================

  const firebaseConfig = {

    apiKey: "AIzaSyBuUpOByfmMt4fpTeGrV3szZjBEpW22Vvk",

    authDomain:
      "escala-de-limpeza-2db5d.firebaseapp.com",

    projectId:
      "escala-de-limpeza-2db5d",

    storageBucket:
      "escala-de-limpeza-2db5d.firebasestorage.app",

    messagingSenderId:
      "929352610860",

    appId:
      "1:929352610860:web:421eedb2980e8874814d89",

    measurementId:
      "G-HLF3DB675W"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  // ================================
  // MORADORES
  // ================================

  const moradores = [
    "Henrique",
    "Eduardo",
    "Moisés",
    "Edvan"
  ];


  // ================================
  // DATA INICIAL DA ESCALA
  // ================================

  // 13/09/2026 = Henrique
  const dataInicio = new Date(2026, 8, 13);


  // ================================
  // FUNÇÕES DE DATA
  // ================================

  function formatarData(data) {

    const dia = String(data.getDate()).padStart(2, "0");

    const mes = String(data.getMonth() + 1).padStart(2, "0");

    const ano = data.getFullYear();

    return `${dia}/${mes}/${ano}`;
  }


  function formatarDataBanco(data) {

    const dia = String(data.getDate()).padStart(2, "0");

    const mes = String(data.getMonth() + 1).padStart(2, "0");

    const ano = data.getFullYear();

    return `${ano}-${mes}-${dia}`;
  }


  function calcularResponsavel(data) {

    const diferenca =
      Math.floor(
        (data - dataInicio) /
        (1000 * 60 * 60 * 24)
      );

    const indice =
      Math.floor(diferenca / 2) % moradores.length;

    return moradores[indice];
  }


  // ================================
  // DATA DE HOJE
  // ================================

  function obterDataHoje() {

    const agora = new Date();

    agora.setHours(0, 0, 0, 0);

    return agora;
  }


  // ================================
  // DOCUMENTO DO DIA
  // ================================

  function idDaLimpeza(data) {

    return formatarDataBanco(data);
  }


  // ================================
  // GARANTIR QUE A LIMPEZA EXISTE
  // ================================

  async function criarLimpezaSeNecessario(data) {

    const responsavel =
      calcularResponsavel(data);

    const id =
      idDaLimpeza(data);

    const referencia =
      doc(db, "limpezas", id);

    await setDoc(
      referencia,
      {
        data: formatarData(data),
        responsavel: responsavel,
        concluido: false
      },
      {
        merge: true
      }
    );
  }


  // ================================
  // MARCAR COMO FEITO
  // ================================

  async function marcarComoFeito() {

  const hoje = obterDataHoje();

  const id = idDaLimpeza(hoje);

  const referencia = doc(db, "limpezas", id);

  try {

    await setDoc(
      referencia,
      {
        data: formatarData(hoje),
        responsavel: calcularResponsavel(hoje),
        concluido: true
      },
      {
        merge: true
      }
    );

    alert("Limpeza marcada como concluída.");

    // Atualiza o histórico depois de salvar
    carregarHistorico();

  } catch (erro) {

    console.error(erro);

    alert(
      "Não foi possível marcar a limpeza como concluída."
    );
  }
}  // ================================
  // MOSTRAR STATUS
  // ================================

  function mostrarStatus(concluido) {

    const status =
      document.getElementById("status");

    const botao =
      document.getElementById("botaoFeito");


    if (concluido) {

      status.innerHTML =
        `<div class="feito">
          LIMPEZA CONCLUÍDA
        </div>`;

      botao.disabled = true;

      botao.innerText =
        "LIMPEZA JÁ FOI FEITA";

    } else {

      status.innerHTML = "";

      botao.disabled = false;

      botao.innerText =
        "MARCAR COMO FEITO";
    }
  }


  // ================================
  // MOSTRAR PRÓXIMA LIMPEZA
  // ================================

  function mostrarProximaLimpeza() {

    const hoje =
      obterDataHoje();

    const proxima =
      new Date(hoje);

    proxima.setDate(
      proxima.getDate() + 2
    );


    const responsavel =
      calcularResponsavel(proxima);


    document.getElementById(
      "proximaLimpeza"
    ).innerHTML =

      `<strong>${formatarData(proxima)}</strong><br>
       Responsável: <strong>${responsavel}</strong>`;
  }


  // ================================
  // HISTÓRICO
  // ================================

  async function carregarHistorico() {

    const historico =
      document.getElementById("historico");


    try {

      const consulta =
        await getDocs(
          collection(db, "limpezas")
        );


      let registros = [];


      consulta.forEach((documento) => {

        registros.push(
          documento.data()
        );

      });


      registros.sort((a, b) => {

        const dataA =
          a.data.split("/").reverse().join("");

        const dataB =
          b.data.split("/").reverse().join("");

        return dataB.localeCompare(dataA);

      });


      if (registros.length === 0) {

        historico.innerHTML =
          "Nenhum registro encontrado.";

        return;
      }


      historico.innerHTML = "";


      registros.forEach((registro) => {

        const item =
          document.createElement("div");

        item.className =
          "historico-item";


        const status =
          registro.concluido
            ? `<span class="status-feito">FEITO</span>`
            : `<span class="status-pendente">PENDENTE</span>`;


        item.innerHTML =

          `<strong>${registro.data}</strong>
           — ${registro.responsavel}
           — ${status}`;


        historico.appendChild(item);

      });


    } catch (erro) {

      console.error(erro);

      historico.innerHTML =
        "Erro ao carregar histórico.";
    }
  }


  // ================================
  // INICIAR APLICATIVO
  // ================================

  async function iniciar() {

    const hoje =
      obterDataHoje();


    // Cria o registro do dia,
    // caso ainda não exista.

    await criarLimpezaSeNecessario(
      hoje
    );


    // Mostra informações

    document.getElementById(
      "dataAtual"
    ).innerText =
      "Data: " + formatarData(hoje);


    document.getElementById(
      "responsavel"
    ).innerText =
      calcularResponsavel(hoje);


    mostrarProximaLimpeza();

    carregarHistorico();


    // ================================
    // OUVIR ALTERAÇÕES EM TEMPO REAL
    // ================================

    const referencia =
      doc(
        db,
        "limpezas",
        idDaLimpeza(hoje)
      );


    onSnapshot(
      referencia,
      (documento) => {

        if (documento.exists()) {

          const dados =
            documento.data();

          mostrarStatus(
            dados.concluido === true
          );

        }

      }
    );


    document.getElementById(
      "botaoFeito"
    ).addEventListener(
      "click",
      marcarComoFeito
    );


    document.getElementById(
      "carregando"
    ).style.display =
      "none";


    document.getElementById(
      "conteudo"
    ).style.display =
      "block";
  }


  iniciar();

</script>

</body>
</html>
